{% extends "base.html" %}
{% block title %}Consultar pedido | ProPat{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/consulta_pedido.css') }}">
{% endblock %}

{% block content %}

<div class="consulta-wrapper">

  <div class="consulta-hero">
    <span class="consulta-icon">📦</span>
    <h1>Consultar pedido</h1>
    <p>Ingresa el número de orden que recibiste al realizar tu compra.</p>
  </div>

  <div class="pp-card">
    <form id="statusForm" class="consulta-form">
      <div class="pp-field" style="flex:1;">
        <label class="pp-label">Número de orden</label>
        <input class="pp-input" name="order_id" type="number"
               min="1" placeholder="Ej: 1" required>
      </div>
      <button class="btn-pp btn-pp-primary consulta-submit" type="submit">
        Consultar →
      </button>
    </form>
  </div>

  <div id="statusAlert" class="pp-alert" style="margin-top:12px;"></div>

  <div id="statusResult" class="pp-card consulta-result-card">
    <div class="consulta-result-top">
      <div class="consulta-result-id">
        <span class="consulta-duck">🐥</span>
        <div>
          <div class="consulta-result-title">Orden <span id="resId"></span></div>
          <div class="consulta-result-fecha" id="resFecha"></div>
        </div>
      </div>
      <div id="resBadge"></div>
    </div>

    <hr class="pp-divider">

    <div class="consulta-result-grid">
      <div>
        <div class="consulta-result-label">Estado</div>
        <div class="consulta-result-value" id="resEstado"></div>
      </div>
      <div>
        <div class="consulta-result-label">Total</div>
        <div class="consulta-result-total" id="resTotal"></div>
      </div>
    </div>
  </div>

</div>

{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/consulta_pedido.js') }}"></script>
{% endblock %}

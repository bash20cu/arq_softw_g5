{% extends "base.html" %}

{% block title %}Login | ProPat{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="bg-white border rounded p-4">
      <h1 class="h4 mb-3">Ingreso al sistema</h1>
      <div id="loginAlert" class="alert alert-danger d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input class="form-control" name="username" value="admin">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" value="admin123">
        </div>
        <button class="btn btn-dark w-100" type="submit">Ingresar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$("#loginForm").on("submit", async function (event) {
  event.preventDefault();
  $("#loginAlert").addClass("d-none").text("");
  const payload = {
    username: $(this).find("[name='username']").val(),
    password: $(this).find("[name='password']").val()
  };

  const response = await fetch("/api/v1/auth/verificar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await response.json();

  if (!response.ok) {
    $("#loginAlert").removeClass("d-none").text(data.error || "No fue posible iniciar sesion");
    return;
  }
  window.location.href = "/principal";
});
</script>
{% endblock %}

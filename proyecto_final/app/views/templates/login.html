{% extends "base.html" %}

{% block title %}Ingresar | ProPat{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}

<div class="login-wrapper">

  <!-- Encabezado visual -->
  <div class="login-hero">
    <span class="duck-icon">🐥</span>
    <h1>Bienvenido</h1>
    <p>Ingresa a tu cuenta de ProPat</p>
  </div>

  <!-- Formulario -->
  <div class="pp-card login-card">

    <div id="loginAlert" class="pp-alert mb-3"></div>

    <form id="loginForm">

      <div class="login-field">
        <label class="pp-label" for="inputUsername">Usuario</label>
        <input
          class="pp-input"
          id="inputUsername"
          name="username"
          type="text"
          placeholder="Tu nombre de usuario"
          autocomplete="username"
          required
        >
      </div>

      <div class="login-field">
        <label class="pp-label" for="inputPassword">Contraseña</label>
        <input
          class="pp-input"
          id="inputPassword"
          name="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="btn-pp btn-pp-primary login-submit" type="submit">
        Ingresar al sistema →
      </button>

    </form>

    <hr class="pp-divider">

    <p class="login-footer">
      ¿No tienes cuenta?
      <a href="/registro">Regístrate aquí</a>
    </p>

  </div>

</div>

{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Proyecto G5</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="Login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link active" href="Registro.html">Registro</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido -->
  <div class="container mt-5">
    <div class="card">
      <div class="card-header">Registro</div>
      <div class="card-body">
        <form id="registerForm">
          <div class="mb-3">
            <label for="cedula" class="form-label">Cédula</label>
            <input type="text" id="cedula" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="usernameReg" class="form-label">Usuario</label>
            <input type="text" id="usernameReg" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="passwordReg" class="form-label">Contraseña</label>
            <input type="password" id="passwordReg" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="rol" class="form-label">Rol</label>
            <input type="number" id="rol" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success">Registrar</button>
        </form>
        <div id="resultadoRegistro" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Tu JavaScript -->
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const cedula = document.getElementById("cedula").value;
      const username = document.getElementById("usernameReg").value;
      const password = document.getElementById("passwordReg").value;
      const rol = document.getElementById("rol").value;

      const response = await fetch("http://localhost:5000/api/v1/usuario", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          cedula_persona: cedula,
          username: username,
          password_hash: password,
          id_rol: rol,
          activo: true
        })
      });

      const data = await response.json();
      document.getElementById("resultadoRegistro").innerText = response.ok 
        ? "Usuario creado: " + JSON.stringify(data) 
        : "Error: " + data.message;
    });
  </script>
</body>
</html>
